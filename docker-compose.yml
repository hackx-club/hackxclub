services:
  # ----------------------------------------------------------------------------
  # Caddy Reverse Proxy (Automatic HTTPS, SSL certificates, HTTP/3 & WAF)
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: hackx-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC support
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@hackx.club}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # Holds TLS certificates across container restarts
      - caddy_config:/config
    networks:
      - frontend_net
    depends_on:
      - app

  # ----------------------------------------------------------------------------
  # Web Application (TanStack Start / Nitro node-server)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://dummy.supabase.co}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-dummy_key}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID:-dummy_id}
    container_name: hackx-app
    restart: unless-stopped
    expose:
      - "3000" # Expose internally to Caddy; not directly to the public internet
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hackxclub}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://dummy.supabase.co}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-dummy_key}
      VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID:-dummy_id}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-clubhackx@gmail.com}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-HackX Club <clubhackx@gmail.com>}
    networks:
      - frontend_net
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # PostgreSQL Database (Local persistent storage on SSD volume)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: hackx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hackxclub}
    ports:
      # Bind to localhost only so the database is never exposed to the public internet
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-hackxclub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

# ------------------------------------------------------------------------------
# Docker Layer Firewall (Network Segmentation)
# ------------------------------------------------------------------------------
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true # Isolated internal network: blocks external ingress/egress for the database layer

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
